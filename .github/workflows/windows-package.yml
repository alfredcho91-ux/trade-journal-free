name: Build Windows Distribution

on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  package:
    if: >-
      ${{
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.head_branch == 'main' &&
         github.event.workflow_run.head_repository.full_name == github.repository) ||
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      }}
    runs-on: windows-latest
    env:
      PACKAGE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Verify manual build passed Tests for selected SHA
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/workflows/test.yml/runs?head_sha=$env:PACKAGE_SHA&event=push&branch=main&status=success&per_page=100"
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json" }
          $runs = Invoke-RestMethod -Uri $uri -Headers $headers
          $match = $runs.workflow_runs | Where-Object {
            $_.head_sha -eq $env:PACKAGE_SHA -and
            $_.event -eq 'push' -and
            $_.head_branch -eq 'main' -and
            $_.status -eq 'completed' -and
            $_.conclusion -eq 'success' -and
            $_.head_repository.full_name -eq $env:GITHUB_REPOSITORY
          } | Select-Object -First 1
          if (-not $match) {
            throw "Selected commit has no successful Tests push run on main: $env:PACKAGE_SHA"
          }

      - uses: actions/checkout@v5
        with:
          ref: ${{ env.PACKAGE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checkout matches tested SHA
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:PACKAGE_SHA) {
            throw "Checked-out commit $actual differs from tested commit $env:PACKAGE_SHA"
          }

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          architecture: x64

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          architecture: x64

      - name: Verify release version declarations
        run: python scripts/check_release_versions.py

      - name: Install Python dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r ../packaging/requirements-build.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Windows distribution
        shell: pwsh
        env:
          PYTHON_BIN: python
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_SIGNING_REQUIRED: ${{ vars.WINDOWS_SIGNING_REQUIRED }}
          WINDOWS_TIMESTAMP_URL: http://timestamp.digicert.com
        run: ./packaging/build_windows_app.ps1

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v6
        with:
          name: Trade-Journal-Windows-x64
          path: Windows/Trade-Journal-Windows.zip
          if-no-files-found: error
          retention-days: 30

      - name: Select source release
        id: release
        shell: pwsh
        run: |
          $package = Get-Content frontend/package.json -Raw | ConvertFrom-Json
          $version = "v$($package.version)"
          $existing = git tag --list $version
          $publish = [string]::IsNullOrWhiteSpace($existing)
          "version=$version" >> $env:GITHUB_OUTPUT
          "publish=$($publish.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if ($publish) {
            Write-Host "Creating source-aligned release $version for $env:PACKAGE_SHA"
          } else {
            Write-Host "Release $version already exists; Windows artifact remains available from this workflow run."
          }

      - name: Publish GitHub Release
        if: steps.release.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.version }}
          name: Trade Journal ${{ steps.release.outputs.version }}
          target_commitish: ${{ env.PACKAGE_SHA }}
          generate_release_notes: true
          files: Windows/Trade-Journal-Windows.zip
