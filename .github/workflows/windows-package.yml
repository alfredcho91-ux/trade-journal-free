name: Build Windows Distribution

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.9"
          architecture: x64

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          architecture: x64

      - name: Verify release version declarations
        run: python scripts/check_release_versions.py

      - name: Install Python dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r ../packaging/requirements-build.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Windows distribution
        shell: pwsh
        env:
          PYTHON_BIN: python
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_SIGNING_REQUIRED: ${{ vars.WINDOWS_SIGNING_REQUIRED }}
          WINDOWS_TIMESTAMP_URL: http://timestamp.digicert.com
        run: ./packaging/build_windows_app.ps1

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v6
        with:
          name: Trade-Journal-Windows-x64
          path: Windows/Trade-Journal-Windows.zip
          if-no-files-found: error
          retention-days: 30

      - name: Select source release
        id: release
        shell: pwsh
        run: |
          $package = Get-Content frontend/package.json -Raw | ConvertFrom-Json
          $version = "v$($package.version)"
          $existing = git tag --list $version
          $publish = [string]::IsNullOrWhiteSpace($existing)
          "version=$version" >> $env:GITHUB_OUTPUT
          "publish=$($publish.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if ($publish) {
            Write-Host "Creating source-aligned release $version for $env:GITHUB_SHA"
          } else {
            Write-Host "Release $version already exists; Windows artifact remains available from this workflow run."
          }

      - name: Publish GitHub Release
        if: steps.release.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.version }}
          name: Trade Journal ${{ steps.release.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: Windows/Trade-Journal-Windows.zip
