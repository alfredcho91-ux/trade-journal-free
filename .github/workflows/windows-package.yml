name: Build Windows Distribution

on:
  workflow_dispatch:

jobs:
  package:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          architecture: x64

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          architecture: x64

      - name: Install Python dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r ../packaging/requirements-build.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Windows distribution
        shell: pwsh
        env:
          PYTHON_BIN: python
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_SIGNING_REQUIRED: ${{ vars.WINDOWS_SIGNING_REQUIRED }}
          WINDOWS_TIMESTAMP_URL: http://timestamp.digicert.com
        run: ./packaging/build_windows_app.ps1

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Trade-Journal-Free-Windows-x64
          path: release/Trade-Journal-Free-Windows.zip
          if-no-files-found: error
          retention-days: 30
