name: Build Windows Distribution

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          architecture: x64

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          architecture: x64

      - name: Install Python dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r ../packaging/requirements-build.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Windows distribution
        shell: pwsh
        env:
          PYTHON_BIN: python
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_SIGNING_REQUIRED: ${{ vars.WINDOWS_SIGNING_REQUIRED }}
          WINDOWS_TIMESTAMP_URL: http://timestamp.digicert.com
        run: ./packaging/build_windows_app.ps1

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Trade-Journal-Windows-x64
          path: Windows/Trade-Journal-Windows.zip
          if-no-files-found: error
          retention-days: 30

      - name: Select next patch release
        id: release
        shell: pwsh
        run: |
          $tags = git tag --list 'v*' | ForEach-Object {
            if ($_ -match '^v(\d+)\.(\d+)\.(\d+)$') {
              [PSCustomObject]@{ Major = [int]$Matches[1]; Minor = [int]$Matches[2]; Patch = [int]$Matches[3] }
            }
          } | Sort-Object Major, Minor, Patch
          $latest = $tags | Select-Object -Last 1
          if ($null -eq $latest) {
            $version = 'v1.0.0'
          } else {
            $version = "v$($latest.Major).$($latest.Minor).$($latest.Patch + 1)"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Creating release $version for $env:GITHUB_SHA"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.version }}
          name: Trade Journal ${{ steps.release.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: Windows/Trade-Journal-Windows.zip
